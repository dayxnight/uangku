<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Uangku - Money Manager</title>

        <link rel="stylesheet" href="theme.css" id="theme-link" />
        <link rel="stylesheet" href="style.css" />

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />

        <style>
            .material-symbols-rounded {
                font-variation-settings:
                    "FILL" 1,
                    "wght" 700,
                    "GRAD" 0,
                    "opsz" 40;
            }
        </style>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    </head>
    <body>
        <input
            type="file"
            id="file-input-hidden"
            accept=".json"
            style="display: none"
        />

        <div class="popup-overlay" id="popup-overlay" style="display: none">
            <div class="modal" id="modal-content">
                <div class="modal-header" id="modal-header">
                    masukkan pemasukan
                </div>
                <input
                    type="text"
                    id="input-desc"
                    placeholder="Keterangan (misal: Beli Es)"
                    style="
                        margin-bottom: 10px;
                        padding: 12px;
                        border-radius: 20px;
                        border: none;
                        background: var(--surface-variant);
                        color: var(--on-surface-variant);
                        outline: none;
                        text-align: center;
                    "
                />
                <input
                    type="number"
                    inputmode="numeric"
                    id="input-value"
                    placeholder="Jumlah (Rp)"
                />
                <button id="save-value">simpan</button>
            </div>
        </div>

        <div class="menu-overlay" id="menu-overlay" style="display: none">
            <div class="menu-window">
                <div class="menu-button export">
                    <span class="material-symbols-rounded">upload</span>
                    <p>export</p>
                </div>
                <div class="menu-button import">
                    <span class="material-symbols-rounded">download</span>
                    <p>import</p>
                </div>
                <div class="menu-button theme" id="theme-toggle">
                    <span class="material-symbols-rounded" id="theme-icon"
                        >dark_mode</span
                    >
                    <p id="theme-text">tema</p>
                </div>
            </div>
        </div>

        <div class="app">
            <header class="container top">
                <div class="header">
                    <div class="welcome-text">
                        <h3>Uangku</h3>
                    </div>
                    <button class="button" id="setting">
                        <span class="material-symbols-rounded">menu</span>
                    </button>
                </div>

                <div class="saldo">
                    <div class="saldo-header">
                        <div class="group">
                            <span class="material-symbols-rounded"
                                >money_bag</span
                            >
                            <p>Total Saldo</p>
                        </div>
                    </div>
                    <span id="sisa-saldo">Rp 0</span>
                </div>
            </header>

            <nav class="container mid">
                <div class="action-button" id="keluar">
                    <span class="material-symbols-rounded"
                        >arrow_circle_up</span
                    >
                    <p>keluar</p>
                </div>

                <div class="action-button" id="masuk">
                    <span class="material-symbols-rounded"
                        >arrow_circle_down</span
                    >
                    <p>masuk</p>
                </div>
            </nav>

            <main class="container bottom">
                <div class="history">
                    <div class="history-header">
                        <h3>Riwayat Transaksi</h3>
                    </div>

                    <div class="history-content" id="history-list"></div>
                </div>
            </main>
        </div>
        <script src="script.js"></script>
    </body>
</html>
